<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The World in One Day — Thursday 19 November 2026</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1024px; height: 1024px; overflow: hidden; }
  body {
    background: #f6f1e5;
    color: #1a1712;
    font-family: "Liberation Sans", Arial, sans-serif;
    padding: 32px 42px 22px 42px;
    display: flex; flex-direction: column;
  }
  .serif { font-family: "Liberation Serif", Georgia, serif; }

  /* ---------- masthead ---------- */
  .topline {
    display: flex; justify-content: space-between; align-items: baseline;
    font-size: 14px; letter-spacing: 2.4px; font-weight: bold; color: #6f6455;
    border-bottom: 2.5px solid #1a1712; padding-bottom: 8px;
  }
  .papername {
    text-align: center; font-size: 38px; font-weight: bold; letter-spacing: 7px;
    padding-top: 12px;
  }
  .dateline {
    text-align: center; font-size: 52px; font-weight: bold; letter-spacing: 0.5px;
    color: #9e1b1b; padding: 4px 0 10px 0; white-space: nowrap;
  }
  .daterule { border-top: 5px solid #1a1712; border-bottom: 1.5px solid #1a1712; height: 4px; margin-bottom: 18px; }

  /* ---------- shared story bits ---------- */
  .kicker { font-size: 14px; font-weight: bold; letter-spacing: 2px; color: #9e1b1b; }
  .caption { color: #332e26; line-height: 1.34; }

  /* ---------- lead ---------- */
  .lead { display: flex; gap: 24px; }
  .lead .txt { flex: 1; }
  .lead h1 { font-size: 44px; line-height: 1.1; font-weight: bold; padding: 7px 0 10px 0; }
  .lead .caption { font-size: 20px; }
  .lead .deck { font-size: 18px; font-style: italic; color: #57503f; line-height: 1.35; padding-top: 12px; }
  .lead .art { width: 330px; flex: none; }

  .rule { border-top: 2px solid #1a1712; margin: 17px 0 15px 0; }

  /* ---------- grid ---------- */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 32px; }
  .tile { display: flex; gap: 15px; padding: 14px 0; border-top: 1.5px solid #b8af9b; }
  .tile .art { width: 100px; flex: none; }
  .tile h2 { font-size: 26px; line-height: 1.14; font-weight: bold; padding: 3px 0 6px 0; }
  .tile .caption { font-size: 17px; }

  /* ---------- bottom ---------- */
  .bottom { display: flex; gap: 15px; align-items: center; border-top: 2px solid #1a1712; padding-top: 14px; margin-top: 2px; }
  .bottom .art { width: 72px; flex: none; }
  .bottom h2 { font-size: 26px; font-weight: bold; padding: 2px 0 5px 0; }
  .bottom .caption { font-size: 17px; }

  .markets {
    margin-top: 14px; background: #1a1712; color: #f6f1e5;
    font-size: 15px; letter-spacing: 0.3px; padding: 9px 12px; white-space: nowrap; overflow: hidden;
  }
  .markets b { color: #e0aa3e; letter-spacing: 1.5px; }
  .sources { margin-top: 10px; text-align: center; font-size: 13px; color: #6f6455; letter-spacing: 0.4px; }
</style>
</head>
<body>

  <div class="topline"><span>MAKE.FUN · DAILY NEWS IMAGE</span><span>THE DAY'S NEWS, ON ONE PAGE</span></div>
  <div class="papername serif">THE WORLD IN ONE DAY</div>

  <div class="daterule"></div>

  <section class="lead" id="lead"></section>
  <div class="rule"></div>
  <section class="grid" id="grid"></section>
  <section class="bottom" id="bottom"></section>
  <div class="markets" id="markets"></div>
  <div class="sources" id="sources"></div>
